name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试 + 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # 测试打的是真实 MySQL + Redis（见 AbstractApiTest / application-test.yml），
    # 所以 CI 用 service 容器补齐这两个依赖，而不是用 H2/mock 把测试改弱。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      # AesCipher 直接读这个环境变量（见 application.yml 的 mindforge.ai-config.secret-key），
      # 不配也能启动（只告警），但配了才能让「保存 AI 配置」相关用例跑到加密分支。
      MINDFORGE_AI_CONFIG_SECRET_KEY: Y2ktYWktY29uZmlnLXNlY3JldC1rZXktMzJieXRlcyE=
      # 测试配置继承 dev profile，但 application-dev.yml 含密钥、不入库。
      # 这里用 SPRING_APPLICATION_JSON 提供 CI 专用值（优先级高于配置文件），
      # 密钥全部是假值，仅用于让测试上下文启动。
      SPRING_APPLICATION_JSON: '{"mindforge":{"redis":{"host":"127.0.0.1","port":6379,"password":"","database":0},"datasource":{"driver-class-name":"com.mysql.cj.jdbc.Driver","host":"127.0.0.1","port":3306,"database":"mindforge_test","username":"root","password":"root"},"jwt":{"secret-prop":"Y2ktdGVzdC1zZWNyZXQta2V5LTMyLWJ5dGVzLWxvbmchIQ==","access-token-expire-minutes-prop":30,"refresh-token-expire-days-prop":14},"internal":{"service-token":"ci-internal-token"},"ai-service":{"base-url":"http://127.0.0.1:8000","service-token":"ci-internal-token"},"storage":{"type":"OSS","oss":{"endpoint":"https://oss-cn-hangzhou.aliyuncs.com","bucket":"ci-test-bucket","access-key-id":"ci-test-ak","access-key-secret":"ci-test-sk"}},"ai-config":{"secret-key":"Y2ktYWktY29uZmlnLXNlY3JldC1rZXktMzJieXRlcyE="}}}'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 初始化 mindforge_test 库
        run: |
          set -euo pipefail
          CID=$(docker ps --filter publish=3306 --format '{{.ID}}' | head -n 1)
          # schema 里写的是 CREATE DATABASE/USE `mindforge`，测试库需要换成 mindforge_test，
          # 否则会把测试数据灌进开发库（AbstractApiTest 会 DELETE 业务表）。
          sed 's/`mindforge`/`mindforge_test`/g' mindforge-schema.sql \
            | docker exec -i "$CID" mysql -uroot -proot
          TABLES=$(docker exec -i "$CID" mysql -uroot -proot -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mindforge_test';")
          echo "mindforge_test tables=$TABLES"
          test "$TABLES" -ge 30

      - name: 构建 + 测试 + SpotBugs + JaCoCo
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: 上传测试与静态检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          if-no-files-found: ignore
          path: |
            target/surefire-reports
            target/site/jacoco
            target/spotbugsXml.xml
