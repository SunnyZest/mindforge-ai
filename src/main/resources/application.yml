server:
  port: 8080
  servlet:
    #   全局 /api 前缀：Controller 里只写 /app/**、/admin/**，不再重复写 /api
    #   Nginx 侧 proxy_pass 不带尾斜杠、原样透传，因此 /api 必须由后端提供
    context-path: /api

spring:
  application:
    name: mindforge-ai
  profiles:
    active: dev
  servlet:
    multipart:
      # 文档上传（PDF / DOCX）。Spring Boot 默认只有 1MB，不改会直接 413。
      max-file-size: 50MB
      max-request-size: 50MB
  # Redis：限流计数、登录失败计数。
  # 实际连接信息在 application-dev.yml 的 mindforge.redis.* 里。
  data:
    redis:
      host: ${mindforge.redis.host}
      port: ${mindforge.redis.port}
      password: ${mindforge.redis.password}
      database: ${mindforge.redis.database:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s
  datasource:
    druid:
      driver-class-name: ${mindforge.datasource.driver-class-name}
      url: jdbc:mysql://${mindforge.datasource.host}:${mindforge.datasource.port}/${mindforge.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${mindforge.datasource.username}
      password: ${mindforge.datasource.password}

  # 邮件（邮箱验证码）。走标准 SMTP，换服务商只改这里，代码不动。
  #
  # ⚠️ QQ 邮箱三个坑：
  #   ① password 要填【授权码】（16 位），不是 QQ 登录密码；
  #   ② 得先去邮箱设置里开启「POP3/SMTP 服务」，授权码是开启后才生成的；
  #   ③ From 必须等于 username（QQ 不允许伪造发件人），显示名在
  #      mindforge.verification.from-name 里配。
  #
  # ⚠️ 凭据只走环境变量，不写进这个文件 —— 它是要进版本库的。
  #    IDEA 里配在 Run Configuration 的 Environment variables：
  #      MAIL_USERNAME=你的QQ号@qq.com;MAIL_PASSWORD=授权码
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          # 465 端口必须用 SSL（QQ 邮箱的 587 才用 STARTTLS）
          ssl:
            enable: true
          # 三个超时都要设：不设的话 SMTP 卡住会把请求线程一起吊死
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis-plus:
  # 复杂 SQL 写在这里的 XML 中（简单查询仍可用注解，但建议统一走 XML）
  # 这是 MP 的默认值，写出来是为了明确 XML 的存放位置
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true  # 是否开启下划线和驼峰的映射
    # 开发期打印 SQL，上线请移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id   # id的生成策略（雪花算法 64 位趋势递增分布式 ID）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mindforge:
  # 高危操作告警（mindforge.alert.*）。
  #   webhook-url   告警外推地址（企业微信 / 钉钉自定义机器人的 text 格式）。
  #                 留空 = 只入库不外推；生产建议配置，否则又回到「没人主动看等于没有」。
  #                 生产环境用环境变量注入：MINDFORGE_ALERT_WEBHOOK_URL
  alert:
    webhook-url: ${MINDFORGE_ALERT_WEBHOOK_URL:}

  # 流式对话线程池。★ maxPoolSize 就是【同时在聊的人数上限】，
  # 超出的请求会被直接拒绝（AbortPolicy）而不是排队 —— 调大前先确认
  # 下游扛得住：每个在跑的流还占一条到 Python 的长连接。
  chat:
    stream:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 100
      await-termination-seconds: 30

  # 验证码（邮箱 / 短信）。★ 这几个都是【防刷闸门】，不是体验参数：
  # 发码接口必须公开（未登录才需要发码），所以它天生是「邮件轰炸」的入口。
  verification:
    code-length: 6
    ttl-minutes: 10
    # 重发冷却（秒）
    cooldown-seconds: 60
    # 同一目标每天最多几条
    daily-limit: 10
    # 同一目标最多试错几次，超了这条码直接作废
    max-attempts: 5
    from-name: MindForge AI

  # 限流与登录保护
  security:
    # 是否信任 X-Forwarded-For 头。
    # ⚠️ 默认 false —— 这个头客户端可以伪造，后端前面没挂可信代理却读它，
    #    攻击者每次换个假 IP 就能绕过限流和登录失败计数。
    #    确实挂了 Nginx / 网关时才改成 true。
    trust-forwarded-headers: false
    rate-limit:
      enabled: true
      # 普通接口：每分钟每 IP 允许的请求数
      default-per-minute: 100
      # 认证接口（登录/注册/刷新）：更严，防爆破
      auth-per-minute: 10
    login-attempt:
      enabled: true
      # 同一账号连续失败多少次后锁定
      max-per-username: 5
      # 同一 IP 连续失败多少次后锁定（放宽些，避免 NAT 下误伤）
      max-per-ip: 20
      # 锁定时长（分钟）
      lock-minutes: 15
  jwt:
    # 由 com.zest.mindforgeai.SecretKeyGenerator 生成（Base64），生产环境用环境变量覆盖,通过环境变量MINDFORGE_JWT_SECRET
    secret: ${mindforge.jwt.secret-prop}
    # accessToken 有效期（分钟）。
    # 有了 refresh 机制后刻意设短：泄露窗口小，过期由前端用 refreshToken 无感续期。
    # 注意：已从 120 缩到 30
    access-token-expire-minutes: ${mindforge.jwt.access-token-expire-minutes-prop}
    # refreshToken 有效期（天）。安全性靠「可撤销」，不靠短有效期。
    refresh-token-expire-days: ${mindforge.jwt.refresh-token-expire-days-prop}

  # 文件存储（mindforge.storage.*）—— 实际值在 application-dev.yml（含密钥，已 gitignore）
  #   type                  OSS / MINIO / LOCAL
  #   oss.endpoint          ⚠️ 必须用【公网】地址，不要用 -internal 结尾的内网地址（本机连不上）
  #   oss.bucket
  #   oss.access-key-id     RAM 子账号的 AK（不要用主账号）
  #   oss.access-key-secret
  # 切换存储后端只需改 type + 加对应实现，业务代码不用动。
  #
  # 已删除文件的清理（默认：恢复窗口 30 天、每天 03:20 清理）：
  #   storage.retention-days   用户删文件后 OSS 对象保留的天数，到期才物理删
  #   storage.purge-cron       清理任务 cron
  #
  # 内部接口（/internal/**，只给 Python AI 服务调）—— 实际值在 application-dev.yml：
  #   internal.service-token           ⚠️ 必配！留空则所有 /internal 请求被拒绝（fail-safe）
  #                                    Java 和 Python 两边配成一样，放 X-Service-Token 头
  #   internal.claim-limit             单次最多认领多少文档（默认 10）
  #   internal.claim-timeout-minutes   认领后多久没回写就收回重派（默认 30）
  #   internal.claim-timeout-cron      回收任务 cron（默认每 10 分钟）
  #
  # ⚠️ 生产环境必须用 Nginx / Docker 内网把 /internal/** 挡在外面，单靠静态 token 不够。

  task:
    # 清理过期 refreshToken 的 cron（默认每天 03:10）
    refresh-token-cleanup-cron: 0 10 3 * * ?
    # 历史数据归档的 cron（默认每天 03:40，避开高峰与清理任务）
    data-archive-cron: 0 40 3 * * ?
    # 日程主动提醒的 cron（默认每小时整点）。
    # ⚠️ 不要改成「每天一次」：提前量固定 24 小时，一天只扫一次的话
    #    「明天 15:00 的面试」要等到明天凌晨才进窗口，用户早上才看到，只剩几小时。
    reminder-cron: 0 0 * * * ?

  # 日程主动提醒（面试 / 笔试到点前发邮件）。
  reminder:
    # 提前多少小时提醒。只做一次，不做「提前 1 小时」——
    # 一天收两封讲同一场面试的邮件，用户会直接去关开关。
    ahead-hours: 24
    # 同一封邮件最多重试几次，达到后放弃（对应 job_event.remind_fail_count）
    max-fail: 3
    # 发件人显示名。地址固定用 spring.mail.username（QQ 邮箱不允许伪造 From）
    from-name: MindForge AI
    # ⚠️ 生产必须改成真实域名，否则邮件里「打开日历」的链接指向 localhost，点开是空页面
    site-url: ${MINDFORGE_SITE_URL:http://localhost:5173}
    # 用户端日历所在路由（日历是「职位」页里的一个视图，没有独立路由）
    calendar-path: /jobs

  # 调 Python AI 服务（Java → Python 方向）。
  # service-token 在 application-dev.yml 里配，和 Python 的 JAVA_SERVICE_TOKEN 一致。
  # base-url 用占位符包着 —— 容器里 Python 的地址是 http://ai-service:8000，
  # 写死 127.0.0.1 的话容器内会连到自己（AI 功能全挂）。
  ai-service:
    base-url: ${MINDFORGE_AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: 3s
    # ⚠️ 读超时要按最慢的接口定 —— 对话、简历/JD 解析、简历优化、面试评分都要等模型生成。
    #
    # ★ 规则：read-timeout > Python 的 extract_timeout_seconds × (1 + Python 的 llm_max_retries)
    #   现在是 300 × 2 = 600 秒，所以这里配 660 秒（留一点余量）。
    #
    #   为什么要把【重试】算进去（2026-10-10 踩的）：
    #   OpenAI SDK 会自动重试，一次超时不会直接失败，而是再试一遍。
    #   实测日志：简历「整体优化」第一次尝试跑满 300 秒超时 → SDK 重试
    #   → 3 分钟后成功，全程约 8 分钟。而当时的 read-timeout 是 360 秒，
    #   Java 早就放弃了 —— 用户看到「AI 服务超时」，其实 Python 那边成功了。
    #
    #   更早一次踩的是同一类坑的另一面：两边都配 120 秒，Java 先掐断连接，
    #   响应只剩半截、连 Content-Type 都读不到，客户端拿到的是
    #   「content type [application/octet-stream] 转换失败」——
    #   看起来像格式问题，完全指不出真因是超时。
    #
    #   一句话：**客户端超时必须大于服务端的最坏耗时**，否则服务端的错误永远传不回来。
    read-timeout: 660s

  # AI 模型配置（管理端维护，阶段 17）。
  ai-config:
    # 配置里 API Key 的加密密钥，Base64 编码；解码后必须是 16/24/32 字节
    # （对应 AES-128/192/256）。生产用环境变量注入。
    #
    # ⚠️ 留空时服务照常启动，但「保存 AI 配置」会直接报错 —— 这是刻意的：
    #    宁可让管理员看到「密钥没配」，也不能悄悄把 API Key 明文存进数据库。
    # ⚠️ 换了这把密钥，库里已有的密文就解不开了，需要重新录入。
    secret-key: ${MINDFORGE_AI_CONFIG_SECRET_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # 双前端架构：用户端 / 管理端分成两个分组，Knife4j 顶部会显示两个 tab
  group-configs:
    - group: 用户端
      packages-to-scan: com.zest.mindforgeai.controller.user
    - group: 管理端
      packages-to-scan: com.zest.mindforgeai.controller.admin

knife4j:
  enable: true

logging:
  level:
    com.zest.mindforgeai: debug
