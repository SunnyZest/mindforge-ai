# ==============================================================================
# MindForge AI 全栈系统 Docker Compose 编排
# 涵盖：基础中间件 (MySQL 8, Redis 7, MinIO) + 后端 (Java 21) + AI 服务 (Python) + Nginx
#
# 【使用前必读】
#   1. cp .env.docker.example .env，把所有密钥填成真实值
#      （用 `openssl rand -base64 32` 生成；不要复用开发环境的密钥）
#   2. 所有密钥都是 ${VAR:?提示} 形式 —— 忘了配会【立刻启动失败】并告诉你缺哪个，
#      而不是带着一个默认密码静默跑起来。
#   3. 端口策略：只有 Nginx 对公网开 80；数据库/Redis/MinIO/后端/AI 服务
#      要么只在内网（容器间），要么只绑 127.0.0.1（供宿主机调试）。
#      云服务器安全组也【不要】放行 3306/6379/8080/8000/9000。
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8.0 数据库
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mindforge-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 对齐 Windows 开发环境（默认 1），避免本地/线上表名大小写行为不一致
      - --lower_case_table_names=1
      # 小内存机器调优：默认 buffer pool 会吃掉 400M+，2-4G 的机器撑不住
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=60
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindforge}
      MYSQL_USER: ${MYSQL_USER:-mindforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行建库脚本（含全部业务表与初始化种子数据）
      - ./mindforge-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # ⚠️ 只绑回环 —— 宿主机上的客户端能连（本地调试用），公网连不上。
    #    生产环境可以整段注释掉：容器间靠内部网络通信，不需要暴露给宿主机。
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 2. Redis 7 缓存与限流
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mindforge-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    environment:
      TZ: Asia/Shanghai
    ports:
      # 同样只绑回环（容器内标准端口是 6379）
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 3. MinIO 对象存储 (S3 兼容)
  #
  # ⚠️ 现状说明：Java 侧的 FileStorageService 目前【只有 OSS 实现】，
  #    这个服务是为后续接入预留的（见 ROADMAP 第七节）。
  #    当前版本文件存储走阿里云 OSS，需要在 .env 里配 MINDFORGE_OSS_* 四项。
  #    接入 MinIO 后可以把 storage.type 切过来，省掉 OSS 流量费。
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: mindforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 设置 MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 控制台只绑回环：需要管理时用 SSH 隧道访问 127.0.0.1:9001
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mindforge-net

  # MinIO 自动初始化：创建 bucket
  # ★ 刻意【不设匿名读】—— 简历/文档是隐私数据，bucket 必须私有，
  #   读取一律走预签名 URL（和 OSS 那条路径一致）。
  #   设成 anonymous download 等于任何人不登录就能下载全部文件（id 可枚举）。
  minio-init:
    image: minio/mc:latest
    container_name: mindforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb local/mindforge-ai || true;
      /usr/bin/mc anonymous set none local/mindforge-ai || true;
      echo 'MinIO bucket mindforge-ai initialized (private)';
      exit 0;
      "
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 4. Java Spring Boot 业务后端
  #    ⚠️ 环境变量名必须和 application-prod.yml 里的 ${...} 占位符【逐字对应】，
  #       对不上就是「配了但没生效」——服务要么连不上数据库，要么直接启动失败。
  # ----------------------------------------------------------------------------
  mindforge-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindforge-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # ---- 数据库（对应 application-prod.yml 的 MINDFORGE_DB_*）----
      MINDFORGE_DB_HOST: mysql
      MINDFORGE_DB_PORT: 3306
      MINDFORGE_DB_NAME: ${MYSQL_DATABASE:-mindforge}
      MINDFORGE_DB_USER: ${MYSQL_USER:-mindforge}
      MINDFORGE_DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
      # ---- Redis ----
      MINDFORGE_REDIS_HOST: redis
      MINDFORGE_REDIS_PORT: 6379
      MINDFORGE_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      # ---- Python AI 服务 ----
      MINDFORGE_AI_SERVICE_BASE_URL: http://ai-service:8000
      # Java ↔ Python 双向调用的共享令牌（两边必须同一个值）
      MINDFORGE_SERVICE_TOKEN: ${SERVICE_TOKEN:?请在 .env 设置 SERVICE_TOKEN}
      # ---- 安全密钥 ----
      MINDFORGE_JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      MINDFORGE_AI_CONFIG_SECRET_KEY: ${AI_CONFIG_SECRET_KEY:?请在 .env 设置 AI_CONFIG_SECRET_KEY}
      # ---- 文件存储（当前走 OSS）----
      MINDFORGE_OSS_ENDPOINT: ${MINDFORGE_OSS_ENDPOINT:?请在 .env 设置 MINDFORGE_OSS_ENDPOINT}
      MINDFORGE_OSS_BUCKET: ${MINDFORGE_OSS_BUCKET:?请在 .env 设置 MINDFORGE_OSS_BUCKET}
      MINDFORGE_OSS_ACCESS_KEY_ID: ${MINDFORGE_OSS_ACCESS_KEY_ID:?请在 .env 设置 MINDFORGE_OSS_ACCESS_KEY_ID}
      MINDFORGE_OSS_ACCESS_KEY_SECRET: ${MINDFORGE_OSS_ACCESS_KEY_SECRET:?请在 .env 设置 MINDFORGE_OSS_ACCESS_KEY_SECRET}
      # ---- JVM：4G 机器上给 512M 堆（加元空间/线程栈约 800M 常驻）----
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai}
      TZ: Asia/Shanghai
    # 只在内网可达，由 Nginx 转发 —— 不映射端口到宿主机
    expose:
      - "8080"
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 5. Python FastAPI AI 服务
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ${AI_SERVICE_PATH:-../mindforge-ai-service}
      dockerfile: Dockerfile
    container_name: mindforge-ai-service
    restart: unless-stopped
    environment:
      JAVA_BASE_URL: http://mindforge-backend:8080/api
      JAVA_SERVICE_TOKEN: ${SERVICE_TOKEN:?请在 .env 设置 SERVICE_TOKEN}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 设置 DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-v4-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v1}
      ENABLE_POLLER: "true"
      SERVICE_PORT: 8000
      TZ: Asia/Shanghai
    volumes:
      # 向量库持久化。用命名卷而不是宿主机路径 —— compose 在 Java 仓库里，
      # 绑到 Python 仓库的相对路径很别扭。
      # 备份：docker run --rm -v mindforge_chroma_data:/data -v $PWD:/backup alpine \
      #         tar czf /backup/chroma-$(date +%F).tar.gz -C /data .
      - chroma_data:/app/data/chroma
    expose:
      - "8000"
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 6. Nginx 网关与静态资源托管
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mindforge-nginx
    restart: unless-stopped
    ports:
      # ★ 唯一对公网开放的端口
      - "80:80"
      # 配好证书后启用 HTTPS（证书可由宿主机 certbot 生成后挂载）：
      # - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端打包产物（在各自仓库 build 后把 dist 路径传进来）
      - ${USER_DIST_PATH:?请在 .env 设置 USER_DIST_PATH}:/var/www/mindforge/user:ro
      - ${ADMIN_DIST_PATH:?请在 .env 设置 ADMIN_DIST_PATH}:/var/www/mindforge/admin:ro
      # HTTPS 证书（启用 443 时打开）
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - mindforge-backend
    networks:
      - mindforge-net

# ==============================================================================
# 持久化卷与网络
# ==============================================================================
volumes:
  mysql_data:
    name: mindforge_mysql_data
  redis_data:
    name: mindforge_redis_data
  minio_data:
    name: mindforge_minio_data
  chroma_data:
    name: mindforge_chroma_data

networks:
  mindforge-net:
    name: mindforge_network
    driver: bridge
