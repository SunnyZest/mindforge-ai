# ==============================================================================
# MindForge AI 全栈系统 Docker Compose 编排文件
# 涵盖：基础中间件 (MySQL 8, Redis 7, MinIO S3) + 后端 (Java 21) + AI 服务 (Python) + 网关前端 (Nginx)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8.0 数据库
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mindforge-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindforge}
      MYSQL_USER: ${MYSQL_USER:-mind}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行建库脚本（含 26 张表与初始化种子数据）
      - ./mindforge-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-mind}", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 2. Redis 7 缓存与限流
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mindforge-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-4513999}
      --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      # 主机暴露 6380 匹配本地开发配置，容器内为标准 6379
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-4513999}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 3. MinIO 对象存储 (S3 兼容协议，本地私有化替代 OSS)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: mindforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API 端口
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Web 管理控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mindforge-net

  # MinIO 自动初始化：创建默认 bucket 并开放公开读取权限
  minio-init:
    image: minio/mc:latest
    container_name: mindforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb local/mindforge-ai || true;
      /usr/bin/mc anonymous set download local/mindforge-ai || true;
      echo 'MinIO Bucket mindforge-ai initialized successfully';
      exit 0;
      "
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 4. Java Spring Boot 业务后端
  # ----------------------------------------------------------------------------
  mindforge-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindforge-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 数据库连接
      MINDFORGE_DATASOURCE_HOST: mysql
      MINDFORGE_DATASOURCE_PORT: 3306
      MINDFORGE_DATASOURCE_DATABASE: ${MYSQL_DATABASE:-mindforge}
      MINDFORGE_DATASOURCE_USERNAME: ${MYSQL_USER:-mind}
      MINDFORGE_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456}
      # Redis 连接
      MINDFORGE_REDIS_HOST: redis
      MINDFORGE_REDIS_PORT: 6379
      MINDFORGE_REDIS_PASSWORD: ${REDIS_PASSWORD:-4513999}
      # Python AI 服务通信
      MINDFORGE_AI_SERVICE_BASE_URL: http://ai-service:8000
      MINDFORGE_AI_SERVICE_SERVICE_TOKEN: ${SERVICE_TOKEN:-5oiQ55Ge56Wl5Zac5qyi5a2Z5Y2a5paH}
      MINDFORGE_INTERNAL_SERVICE_TOKEN: ${SERVICE_TOKEN:-5oiQ55Ge56Wl5Zac5qyi5a2Z5Y2a5paH}
      # 安全密钥
      MINDFORGE_JWT_SECRET_PROP: ${JWT_SECRET:-5iDVXmCTWP8J6oaUuyK5ivTpP+uE4+Ry5sx6HeUz5Lc=}
      MINDFORGE_AI_CONFIG_SECRET_KEY: ${AI_CONFIG_SECRET_KEY:-ciBHqdt0VGIcvkXC3ppKyyOzHc+z+gFrQSw8+8bnZ3E=}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 5. Python FastAPI AI 微服务
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: D:/pythoncode/mindforge-ai-service
      dockerfile: Dockerfile
    container_name: mindforge-ai-service
    restart: unless-stopped
    environment:
      JAVA_BASE_URL: http://mindforge-backend:8080/api
      JAVA_SERVICE_TOKEN: ${SERVICE_TOKEN:-5oiQ55Ge56Wl5Zac5qyi5a2Z5Y2a5paH}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-v4-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v1}
      ENABLE_POLLER: "true"
      SERVICE_PORT: 8000
      TZ: Asia/Shanghai
    volumes:
      # 持久化嵌入向量数据库 ChromaDB
      - D:/pythoncode/mindforge-ai-service/data/chroma:/app/data/chroma
    ports:
      - "8000:8000"
    networks:
      - mindforge-net

  # ----------------------------------------------------------------------------
  # 6. Nginx 网关与静态资源托管
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mindforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端打包后的 dist 目录挂载
      - D:/Vue/mindforge/apps/user/dist:/var/www/mindforge/user:ro
      - D:/Vue/mindforge/apps/admin/dist:/var/www/mindforge/admin:ro
    depends_on:
      - mindforge-backend
    networks:
      - mindforge-net

# ==============================================================================
# 持久化卷与网络定义
# ==============================================================================
volumes:
  mysql_data:
    name: mindforge_mysql_data
  redis_data:
    name: mindforge_redis_data
  minio_data:
    name: mindforge_minio_data

networks:
  mindforge-net:
    name: mindforge_network
    driver: bridge
