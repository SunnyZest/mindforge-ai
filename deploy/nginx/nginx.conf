# ==============================================================================
# MindForge 容器化部署专用 Nginx 配置文件
# ==============================================================================

upstream java_backend {
    server mindforge-backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # --------------------------------------------------------------------------
    # 1. 管理端（/admin/）
    # --------------------------------------------------------------------------
    location ^~ /admin/ {
        alias /var/www/mindforge/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    location ^~ /admin/assets/ {
        alias /var/www/mindforge/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. 用户端（/）
    # --------------------------------------------------------------------------
    location / {
        root /var/www/mindforge/user;
        index index.html;
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    location ^~ /assets/ {
        root /var/www/mindforge/user;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. 后端业务 API 反向代理（/api/）
    # --------------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://java_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 660s; # 配合 AI 长文本生成与面试分析

        # SSE (Server-Sent Events) 流式对话支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # --------------------------------------------------------------------------
    # 4. 安全防护：严格屏蔽外网直接访问内部接口
    # --------------------------------------------------------------------------
    location ^~ /internal/ {
        return 403;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
